# 仅数据库进 Docker；API / Web 在宿主机构建运行
# 端口 127.0.0.1:3308 → 容器 3306，避免与 mysql-test:3306 / mysql2:3307 冲突
services:
  mysql:
    image: mysql:8.0
    container_name: ningpm-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ningpm
      MYSQL_USER: ningpm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - ningpm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uningpm", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  ningpm_mysql_data:
    name: ningpm_mysql_data
